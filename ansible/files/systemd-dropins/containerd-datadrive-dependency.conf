# containerd data-dir (/var/lib/containerd) is a symlink into /datadrive/containerd.
# Without this, containerd races /datadrive mounting at boot and retries in a tight
# `mkdir: file exists` loop (seen 2026-07-28: 75 failed attempts over 6.5 minutes)
# until the mount happens to land. RequiresMountsFor makes systemd order this properly
# instead of relying on blind restart-retry luck.
[Unit]
RequiresMountsFor=/datadrive
