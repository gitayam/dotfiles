# CT 100 (syncthing-hub) bind-mounts 5 paths under /datadrive/* (see /etc/pve/lxc/100.conf).
# pve-guests.service had no ordering dependency on /datadrive, so it raced the mount at
# boot and failed to autostart CT 100 on both the 2026-07-24 and 2026-07-28 reboots
# (same root-cause class as containerd.service/docker.service - see
# docs/lessons-learned/proxmox-boot-race-2026-07-28.md). This delays ALL guest autostart
# until /datadrive is mounted, which is safe (guests would fail/retry anyway if their
# storage is not ready).
[Unit]
RequiresMountsFor=/datadrive
