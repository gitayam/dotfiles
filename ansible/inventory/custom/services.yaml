    note: "Standalone container - check for compose file location"

  - name: headscale
    path: /home/headscale
    tags: [headscale, vpn, tailscale, custom]
    enabled: false
    note: "VERIFIED 2026-07-14: no containers running from this path (docker compose ps -a empty). Directory is a Node-based checkout (pnpm-lock.yaml, lefthook.yml — looks like a headscale UI/admin dev checkout, not the core headscale service) with its compose file named compose.yaml, not docker-compose.yml (docker_quick/docker_compose_update tasks only look for the legacy filename, so this would fail the file-check even if enabled). Also has a dirty git tree (6 changed lines) — don't touch without operator input. Tailscale (not headscale) is the actual VPN in use per ai-coding-env CLAUDE.md; this looks like a dormant experiment."

