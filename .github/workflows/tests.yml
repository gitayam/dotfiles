# Runs tests/run.sh on macOS and Linux. On Ubuntu this also runs
# linux/harden.sh --check (read-only) and the Linux setup dry run on a real
# Linux machine. Nothing here applies changes or uses secrets.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # v7.0.1, pinned to its commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install zsh, 7-Zip, age and sops (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq zsh 7zip age
          # sops isn't packaged for Ubuntu: pinned release, checked against its sha256 list
          v=3.13.3; cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/getsops/sops/releases/download/v$v/sops-v$v.linux.amd64"
          curl -fsSLO "https://github.com/getsops/sops/releases/download/v$v/sops-v$v.checksums.txt"
          grep " sops-v$v.linux.amd64$" "sops-v$v.checksums.txt" | sha256sum --check -
          sudo install -m 0755 "sops-v$v.linux.amd64" /usr/local/bin/sops
      - name: Install sops and age (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_ASK=1 brew install sops age
      - name: Run tests
        run: tests/run.sh -v
