# Self-hosted model registry, read by claude-z (Claude Code) and zq (direct calls).
#
# keys        comma-separated names; the first is the canonical one (z<key> for claude-z)
# use         chat, embed or translate. Every chat model works with zq; Claude
#             Code (claude-z) also needs a window of 40K+ (z1, z2 today; the
#             32K models fail on its 25–29K opening prompt)
# ssh         host alias in ~/.ssh/config; "-" for this machine
# remote      address the tunnel forwards to, as seen from the server
# port        local port on this Mac
# model       model id the server expects
# opts        nothink: send enable_thinking=false on direct calls. These Qwen
#             servers run without a reasoning parser, so otherwise the model's
#             reasoning comes back inside the answer text. GLM and gpt-oss
#             separate it server-side and must not get the flag (GLM then
#             inlines it). Claude Code can't send the flag; the real fix is `--reasoning-parser qwen3` on the server.
#
# Ports on dl are its published host ports (stable across container restarts).
# zenithflow publishes no host port for GLM, so it uses the container address.
# Checked 2026-11-12: every chat model below answers both /v1/messages (Claude
# Code) and /v1/chat/completions (OpenAI clients). muse-glimmer is listed by
# dl:8009 but returns 404, so it isn't here.
#
# keys          use        ssh         remote             port   model                                       opts
1,glm         chat       zenithflow  172.18.0.4:8000    8001   glm-5.3-flash                               -
2,gptoss      chat       dl          127.0.0.1:8008     8002   openai/gpt-oss-120b                         -
2q,qwen       chat       dl          127.0.0.1:8013     8003   huihui-ai/Huihui-Qwen3.8-27B-abliterated    nothink
2s,qwen9b     chat       dl          127.0.0.1:8013     8003   huihui-ai/Huihui-Qwen3.5-9B-abliterated     nothink
2f,fable      chat       dl          127.0.0.1:8009     8004   DavidAU/Qwen3.6-27B-Fable-711-FP8           nothink
2f2,fable2    chat       dl          127.0.0.1:8018     8005   DavidAU/Qwen3.6-27B-Fable-711-FP8           nothink
2t,translate  translate  dl          127.0.0.1:8012     8006   translategemma:12b                          -
2e,embed      embed      dl          127.0.0.1:8011     8007   nomic-ai/nomic-embed-text-v1.5              -
l,local       chat       -           -                  11434  qwen3-coder:30b                             -
