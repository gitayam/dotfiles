# tmux config from dotfiles shared/tmux/.tmux.conf. The setup scripts copy it to
# ~/.tmux.conf only when you have none; edit freely.
# Remote work: `tm` (tmux new -A -s main) attaches to the session, or starts it,
# so work survives SSH drops, sleep and Wi-Fi changes.

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Snappy Escape in vim/neovim
set -sg escape-time 10
set -g focus-events on
# screen-256color: macOS's built-in terminfo has no tmux-256color entry
set -g default-terminal "screen-256color"
# Copy to the local clipboard over SSH (OSC 52)
set -g set-clipboard on
# Prefix r reloads this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
